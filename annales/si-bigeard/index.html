<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annales SI</title><meta name="robots" content="noindex">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6b7385;--ac:#2563eb;--bd:#e3e6ec;--hl:#fde68a}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2030;--tx:#e6e9f0;--mut:#8f99ad;--ac:#6ea0ff;--bd:#2b3247;--hl:#7a5c00}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--bd)}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:18px;margin:0 0 10px}
#q{width:100%;padding:12px 14px;font-size:17px;border:2px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);outline:none}
#q:focus{border-color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.sep{width:1px;height:18px;background:var(--bd);margin:0 4px}
#info{color:var(--mut);font-size:13px;margin-top:6px}
main{max-width:1000px;margin:0 auto;padding:12px 16px 60px}
.res{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin:8px 0;display:block;text-decoration:none;color:inherit}
.res:hover{border-color:var(--ac)}
.res .t{font-weight:600;color:var(--ac)}
.res .p{color:var(--mut);font-size:13px;margin-top:2px}
.tag{display:inline-block;font-size:11px;border-radius:4px;padding:1px 6px;margin-right:4px;background:var(--bd);color:var(--tx);vertical-align:1px}
mark{background:var(--hl);color:inherit;border-radius:2px}
details{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin:8px 0}
summary{cursor:pointer;padding:10px 14px;font-weight:600}
summary small{color:var(--mut);font-weight:400}
details details{margin:4px 10px;background:var(--bg)}
.files{padding:2px 14px 10px}
.files a{display:block;padding:4px 0;text-decoration:none;color:var(--tx);border-top:1px solid var(--bd)}
.files a:hover{color:var(--ac)}
.files a span{color:var(--mut);font-size:12px;margin-left:6px}
.empty{color:var(--mut);text-align:center;padding:40px}

body.locked header,body.locked main{visibility:hidden}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:99}
#gate .box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:28px;width:min(340px,90vw);text-align:center}
#gate input{width:100%;padding:11px;font-size:17px;border:2px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);text-align:center;margin:12px 0}
#gate button{width:100%;padding:11px;font-size:16px;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer}
#gate .err{color:#dc2626;min-height:20px;font-size:13px;margin:8px 0 0}
</style>
</head>
<body>
<header><div class="wrap">
<h1>📚 Annales SI — index S2I Bigeard</h1><a href="../index.html" style="font-size:13px">← Annales</a>
<input id="q" type="search" placeholder="Tape le nom d'un exo ou d'un cours… (ex : pompe radial, cinématique, TD vanne)" autofocus autocomplete="off">
<div class="chips" id="chips"></div>
<div id="info"></div>
</div></header>
<main id="out"></main>
<div id="gate"><form class="box" id="gf"><div style="font-size:34px">🔒</div><h2 style="margin:6px 0">Accès protégé</h2>
<input id="code" type="password" inputmode="numeric" placeholder="Code" autocomplete="off" autofocus>
<button type="submit">Déverrouiller</button><p class="err" id="gerr"></p></form></div>
<script>
let DATA=[];
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let fv='',fy='';

function chips(){
  const mk=(vals,cur,key)=>vals.map(v=>`<button class="chip ${cur===v?'on':''}" data-k="${key}" data-v="${esc(v)}">${esc(v)}</button>`).join('');
  const niv=[...new Set(DATA.map(f=>f.v).filter(Boolean))].sort();
  const typ=[...new Set(DATA.map(f=>f.y))].sort();
  $('chips').innerHTML=mk(niv,fv,'v')+'<span class="sep"></span>'+mk(typ,fy,'y');
}
$('chips').onclick=e=>{
  const b=e.target.closest('.chip');if(!b)return;
  const k=b.dataset.k,v=b.dataset.v;
  if(k==='v')fv=fv===v?'':v;else fy=fy===v?'':v;
  chips();render();
};

function hl(text,words){
  // surligne les mots (insensible aux accents) en conservant la longueur du texte
  const n=norm(text);let marks=[];
  words.forEach(w=>{let i=0;while(w&&(i=n.indexOf(w,i))>-1){marks.push([i,i+w.length]);i+=w.length}});
  if(!marks.length)return esc(text);
  marks.sort((a,b)=>a[0]-b[0]);
  let out='',pos=0;
  for(const [a,b] of marks){if(a<pos)continue;out+=esc(text.slice(pos,a))+'<mark>'+esc(text.slice(a,b))+'</mark>';pos=b}
  return out+esc(text.slice(pos));
}
const taille=k=>k>=1024?(k/1024).toFixed(1)+' Mo':k+' Ko';

function render(){
  const words=norm($('q').value).split(/\s+/).filter(Boolean);
  let list=DATA.filter(f=>(!fv||f.v===fv)&&(!fy||f.y===fy)&&words.every(w=>f.h.includes(w)));
  const out=$('out');
  if(!words.length&&!fv&&!fy){
    $('info').textContent=DATA.length+' fichiers — tape pour chercher ou parcours ci-dessous';
    const g={};
    DATA.forEach(f=>{const c=f.k||f.c;(g[c]??={})[f.c]??=[];g[c][f.c].push(f)});
    out.innerHTML=Object.keys(g).sort().map(c=>{
      const subs=g[c],nb=Object.values(subs).reduce((s,a)=>s+a.length,0);
      return `<details><summary>${esc(c)} <small>(${nb})</small></summary>`+Object.keys(subs).sort().map(s=>
        `<details><summary>${esc(s)} <small>(${subs[s].length})</small></summary><div class="files">`+
        subs[s].map(f=>`<a href="${esc(f.u)}" target="_blank" rel="noopener">${esc(f.t)}<span>${esc([f.v,f.y,taille(f.s)].filter(Boolean).join(' · '))}</span></a>`).join('')+
        `</div></details>`).join('')+`</details>`}).join('');
    return;
  }
  $('info').textContent=list.length+' résultat'+(list.length>1?'s':'');
  if(!list.length){out.innerHTML='<div class="empty">Rien trouvé 🤷</div>';return}
  out.innerHTML=list.slice(0,300).map(f=>`<a class="res" href="${esc(f.u)}" target="_blank" rel="noopener">
    <div class="t">${hl(f.t,words)}</div>
    <div class="p"><span class="tag">${esc(f.v||'—')}</span><span class="tag">${esc(f.y)}</span>
    📁 ${f.k?hl(f.k,words)+' › ':''}${hl(f.c,words)} <span style="opacity:.7">· ${esc(f.d)}/${hl(f.n,words)} · ${taille(f.s)}</span></div></a>`).join('')
    +(list.length>300?`<div class="empty">… ${list.length-300} autres, précise ta recherche</div>`:'');
}
$('q').addEventListener('input',render);
