<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SI TD</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6b7385;--ac:#2563eb;--bd:#e3e6ec;--hl:#fde68a;--ok:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2030;--tx:#e6e9f0;--mut:#8f99ad;--ac:#6ea0ff;--bd:#2b3247;--hl:#7a5c00;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 10px;border-bottom:1px solid var(--bd)}
.wrap{max-width:1000px;margin:0 auto}
.top{display:flex;align-items:baseline;gap:14px;margin-bottom:8px}
h1{font-size:20px;margin:0}
.top a{font-size:13px;color:var(--ac);text-decoration:none}
#q{width:100%;padding:11px 14px;font-size:16px;border:2px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);outline:none}
#q:focus{border-color:var(--ac)}
#info{color:var(--mut);font-size:13px;margin-top:6px;min-height:18px}
main{max-width:1000px;margin:0 auto;padding:12px 16px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.card:hover{border-color:var(--ac)}
.card b{display:block;margin-bottom:3px}
.card span{color:var(--mut);font-size:13px}
.back{background:none;border:0;color:var(--ac);cursor:pointer;font-size:14px;padding:4px 0;margin-bottom:6px}
h2{font-size:19px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.tab{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 18px;font-size:15px;cursor:pointer}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.sep{width:1px;height:18px;background:var(--bd);margin:0 4px}
.grp{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin:8px 0;padding:2px 14px 8px}
.grp h3{font-size:14px;margin:10px 0 4px;color:var(--mut);font-weight:600}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--bd)}
.row .n{flex:1;min-width:0}
.row a{color:var(--tx);text-decoration:none}
.row a.m{font-weight:500}
.row a:hover{color:var(--ac)}
.tag{display:inline-block;font-size:11px;border-radius:4px;padding:1px 6px;background:var(--bd);color:var(--tx);white-space:nowrap}
a.cor{font-size:12px;color:var(--ok);border:1px solid var(--ok);border-radius:6px;padding:1px 8px;white-space:nowrap}
.sz{color:var(--mut);font-size:12px;white-space:nowrap}
.res{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 14px;margin:8px 0}
.res .p{color:var(--mut);font-size:13px;margin-top:2px}
mark{background:var(--hl);color:inherit;border-radius:2px}
.empty{color:var(--mut);text-align:center;padding:40px}
body.locked header,body.locked main{visibility:hidden}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:99}
#gate .box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:28px;width:min(340px,90vw);text-align:center}
#gate input{width:100%;padding:11px;font-size:17px;border:2px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);text-align:center;margin:12px 0}
#gate button{width:100%;padding:11px;font-size:16px;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer}
#gate .err{color:#dc2626;min-height:20px;font-size:13px;margin:8px 0 0}
</style>
</head>

let DATA=[],ORDRE=[],chap=null,tab='TD',niv='';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const taille=k=>k>=1024?(k/1024).toFixed(1)+' Mo':k+' Ko';
const unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

function hl(text,words){
  const n=norm(text);let m=[];
  words.forEach(w=>{let i=0;while(w&&(i=n.indexOf(w,i))>-1){m.push([i,i+w.length]);i+=w.length}});
  if(!m.length)return esc(text);
  m.sort((a,b)=>a[0]-b[0]);let o='',p=0;
  for(const [a,b] of m){if(a<p)continue;o+=esc(text.slice(p,a))+'<mark>'+esc(text.slice(a,b))+'</mark>';p=b}
  return o+esc(text.slice(p));
}
function row(f,words){
  return `<div class="row"><div class="n"><a class="m" href="${esc(f.u)}" target="_blank" rel="noopener">${hl(f.t,words||[])}</a></div>
  ${f.v?`<span class="tag">${esc(f.v)}</span>`:''}${f.y!=='TD'?`<span class="tag">${esc(f.y)}</span>`:''}
  ${f.k?`<a class="cor" href="${esc(f.k)}" target="_blank" rel="noopener">corrigé</a>`:''}
  <span class="sz">${taille(f.s)}</span></div>`;
}
function home(){
  chap=null;location.hash='';
  $('info').textContent=DATA.length+' documents · '+ORDRE.length+' chapitres';
  $('out').innerHTML='<div class="grid">'+ORDRE.map((c,i)=>{
    const d=DATA.filter(f=>f.c===c);if(!d.length)return'';
    return `<button class="card" data-i="${i}"><b>${esc(c)}</b><span>${d.filter(f=>f.o==='CM').length} CM · ${d.filter(f=>f.o==='TD').length} TD</span></button>`}).join('')+'</div>';
}
function open_(c,t){
  chap=c;tab=t||tab;location.hash=ORDRE.indexOf(c);
  const d=DATA.filter(f=>f.c===c);
  const nCM=d.filter(f=>f.o==='CM').length,nTD=d.filter(f=>f.o==='TD').length;
  if(tab==='TD'&&!nTD&&nCM)tab='CM';if(tab==='CM'&&!nCM&&nTD)tab='TD';
  const niveaux=[...new Set(d.filter(f=>f.o===tab).map(f=>f.v).filter(Boolean))].sort();
  if(niv&&!niveaux.includes(niv))niv='';
  const l=d.filter(f=>f.o===tab&&(!niv||f.v===niv));
  const g={};l.forEach(f=>(g[f.g]??=[]).push(f));
  $('info').textContent=l.length+' document'+(l.length>1?'s':'');
  $('out').innerHTML=`<button class="back" id="bk">&larr; Sommaire</button><h2>${esc(c)}</h2>
  <div class="tabs"><button class="tab ${tab==='CM'?'on':''}" data-t="CM">CM (${nCM})</button><button class="tab ${tab==='TD'?'on':''}" data-t="TD">TD (${nTD})</button>
  ${niveaux.length>1?'<span class="sep"></span>'+niveaux.map(v=>`<button class="chip ${niv===v?'on':''}" data-v="${esc(v)}">${esc(v)}</button>`).join(''):''}</div>`+
  Object.keys(g).map(k=>`<div class="grp">${(g[k].length>1||g[k][0].t!==k)&&k!=='Général'?`<h3>${esc(k)}</h3>`:''}${g[k].map(f=>row(f)).join('')}</div>`).join('');
}
function search(){
  const words=norm($('q').value).split(/\s+/).filter(Boolean);
  if(!words.length){chap?open_(chap):home();return}
  const l=DATA.filter(f=>words.every(w=>f.h.includes(w)));
  $('info').textContent=l.length+' résultat'+(l.length>1?'s':'');
  $('out').innerHTML=l.length?l.slice(0,300).map(f=>`<div class="res">${row(f,words)}<div class="p">${esc(f.c)} &rsaquo; ${esc(f.o)}${f.g!=='Général'?' &rsaquo; '+esc(f.g):''}</div></div>`).join('')
    +(l.length>300?`<div class="empty">… ${l.length-300} autres, précise ta recherche</div>`:''):'<div class="empty">Rien trouvé</div>';
}
$('out').addEventListener('click',e=>{
  const c=e.target.closest('.card');if(c){niv='';open_(ORDRE[+c.dataset.i]);scrollTo(0,0);return}
  if(e.target.closest('#bk')){home();return}
  const t=e.target.closest('.tab');if(t){open_(chap,t.dataset.t);return}
  const v=e.target.closest('.chip');if(v){niv=niv===v.dataset.v?'':v.dataset.v;open_(chap)}
});
$('q').addEventListener('input',search);
$('gf').addEventListener('submit',async e=>{
  e.preventDefault();$('gerr').textContent='';
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode($('code').value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb(P.i)},key,unb(P.c));
    const j=JSON.parse(new TextDecoder().decode(buf));DATA=j.d;ORDRE=j.o;
    DATA.forEach(f=>{f.h=norm([f.t,f.c,f.g,f.v,f.y].join(' '))});
    $('gate').remove();document.body.classList.remove('locked');
    const h=parseInt(location.hash.slice(1));
    isNaN(h)||!ORDRE[h]?home():open_(ORDRE[h]);
  }catch(_){$('gerr').textContent='Code incorrect.';$('code').value='';$('code').focus()}
});
</script>
