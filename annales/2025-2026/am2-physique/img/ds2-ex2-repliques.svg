<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>
  <defs><marker id="ax3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <!-- zone repliement -->
  <rect x="352.5" y="40" width="377.5" height="230" fill="#fee2e2" opacity="0.6"/>
  <text x="540" y="66" font-size="20" text-anchor="middle" fill="#b91c1c">au-delà de fe/2 : hors écran</text>
  <!-- axe -->
  <line x1="50" y1="270" x2="740" y2="270" stroke="#334155" stroke-width="2" marker-end="url(#ax3)"/>
  <text x="735" y="300" font-size="20" text-anchor="end" fill="#334155">f (MHz)</text>
  <!-- graduations : x = 50 + 242 f -->
  <g font-size="20" fill="#0f172a" text-anchor="middle">
    <text x="50" y="296">0</text>
    <text x="171" y="296">0,5</text>
    <text x="292" y="296">1</text>
    <text x="413" y="296">1,5</text>
    <text x="534" y="296">2</text>
    <text x="655" y="296">2,5</text>
  </g>
  <!-- fe/2 et fe -->
  <line x1="352.5" y1="40" x2="352.5" y2="270" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="352.5" y="326" font-size="20" text-anchor="middle" fill="#b91c1c">fe/2 = 1,25</text>
  <line x1="655" y1="90" x2="655" y2="270" stroke="#334155" stroke-width="2" stroke-dasharray="3 5"/>
  <text x="655" y="326" font-size="20" text-anchor="middle" fill="#334155">fe = 2,5</text>
  <!-- spectre réel (n impair, amplitude en 1/n) -->
  <g stroke="#0d9488" stroke-width="6">
    <line x1="74.2" y1="270" x2="74.2" y2="110"/>
    <line x1="122.6" y1="270" x2="122.6" y2="216.7"/>
    <line x1="171" y1="270" x2="171" y2="238"/>
    <line x1="219.4" y1="270" x2="219.4" y2="247.1"/>
    <line x1="267.8" y1="270" x2="267.8" y2="252.2"/>
    <line x1="316.2" y1="270" x2="316.2" y2="255.5"/>
  </g>
  <!-- réplique autour de fe : raies en fe - fn -->
  <g stroke="#94a3b8" stroke-width="6">
    <line x1="630.8" y1="270" x2="630.8" y2="110"/>
    <line x1="582.4" y1="270" x2="582.4" y2="216.7"/>
    <line x1="534" y1="270" x2="534" y2="238"/>
    <line x1="485.6" y1="270" x2="485.6" y2="247.1"/>
    <line x1="437.2" y1="270" x2="437.2" y2="252.2"/>
    <line x1="388.8" y1="270" x2="388.8" y2="255.5"/>
  </g>
  <text x="90" y="104" font-size="20" fill="#0f766e">spectre du signal (f₁, f₃, f₅…)</text>
  <text x="640" y="104" font-size="20" text-anchor="end" fill="#475569">réplique : fe − fn</text>
</svg>
